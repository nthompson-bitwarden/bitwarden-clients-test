map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  client_max_body_size 525m;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location / { proxy_pass http://web:5000; }
  location /api/ { proxy_pass http://api:5000/; }
  location /identity { proxy_pass http://identity:5000; }
  location /admin { proxy_pass http://admin:5000; }
  location /sso { proxy_pass http://sso:5000; }
  location /scim/ { proxy_pass http://scim:5000/; }
  location /icons/ { proxy_pass http://icons:5000/; }
  location /attachments/ { proxy_pass http://attachments:5000/; }
  location /send/ { proxy_pass http://sendfiles:8080/; }
  location /events/ { proxy_pass http://events:5000/; }
  location /notifications/ {
    proxy_pass http://notifications:5000/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
