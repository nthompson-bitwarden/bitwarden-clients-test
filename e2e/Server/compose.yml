# All server code and the CLI use the same checkout. No fixed container names or host DB ports.
x-app: &app
  env_file: ${E2E_STATE_DIR}/server.env
  volumes:
    - core:/etc/bitwarden/core
    - ${E2E_STATE_DIR}/identity:/etc/bitwarden/identity:ro
  depends_on:
    admin:
      condition: service_healthy

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${E2E_DB_PASSWORD}
    volumes:
      - database:/var/opt/mssql
    healthcheck:
      test:
        [
          CMD-SHELL,
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" > /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Admin performs the upstream database migrations before becoming healthy.
  admin:
    <<: *app
    build:
      context: ${E2E_STATE_DIR}/server
      dockerfile: src/Admin/Dockerfile
    depends_on:
      mssql:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: ${E2E_STATE_DIR}/server
      dockerfile: src/Api/Dockerfile

  identity:
    <<: *app
    build:
      context: ${E2E_STATE_DIR}/server
      dockerfile: src/Identity/Dockerfile

  notifications:
    <<: *app
    build:
      context: ${E2E_STATE_DIR}/server
      dockerfile: src/Notifications/Dockerfile

  events:
    <<: *app
    build:
      context: ${E2E_STATE_DIR}/server
      dockerfile: src/Events/Dockerfile

  sso:
    <<: *app
    build:
      context: ${E2E_STATE_DIR}/server
      dockerfile: bitwarden_license/src/Sso/Dockerfile

  scim:
    <<: *app
    build:
      context: ${E2E_STATE_DIR}/server
      dockerfile: bitwarden_license/src/Scim/Dockerfile

  icons:
    <<: *app
    build:
      context: ${E2E_STATE_DIR}/server
      dockerfile: src/Icons/Dockerfile

  attachments:
    <<: *app
    build:
      context: ${E2E_STATE_DIR}/server
      dockerfile: util/Attachments/Dockerfile

  web:
    image: ${E2E_WEB_IMAGE}

  sendfiles:
    image: nginx:1.28-alpine
    volumes:
      - core:/vault:ro
      - ./sendfiles.conf:/etc/nginx/conf.d/default.conf:ro

  mail:
    image: sj26/mailcatcher:latest
    ports:
      - "127.0.0.1:${E2E_MAIL_PORT}:1080"

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${E2E_SERVER_PORT}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      identity:
        condition: service_healthy
      notifications:
        condition: service_healthy
      events:
        condition: service_healthy
      sso:
        condition: service_healthy
      scim:
        condition: service_healthy
      icons:
        condition: service_healthy
      attachments:
        condition: service_healthy
      web:
        condition: service_started
      sendfiles:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/api/alive"]
      interval: 5s
      timeout: 5s
      retries: 60

  seeder-cli:
    <<: *app
    profiles: [tools]
    build:
      context: ${E2E_STATE_DIR}/server
      dockerfile: ${E2E_SERVER_DIR}/SeederCli.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - core:/etc/bitwarden/core
    entrypoint: [dotnet, /app/SeederUtility.dll]

  seeder-api:
    <<: *app
    build:
      context: ${E2E_STATE_DIR}/server
      dockerfile: ${E2E_SERVER_DIR}/SeederApi.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      seederSettings__accounts__0__username: e2e
      seederSettings__accounts__0__password: ${E2E_SEEDER_API_PASSWORD}
    ports:
      - "127.0.0.1:${E2E_SEEDER_PORT}:5000"

volumes:
  database:
  core:
