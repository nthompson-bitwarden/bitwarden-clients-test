name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        run: |
          git remote add upstream \
            https://github.com/bitwarden/clients.git

          git fetch upstream main
          # Pause before committing so upstream cannot change our e2e directory.
          if ! git merge upstream/main --no-commit --no-ff; then
            # Only merge conflicts can be resolved by restoring excluded paths.
            if [ -z "$(git ls-files --unmerged)" ]; then
              exit 1
            fi
          fi

          # git restore rejects unmerged paths absent from HEAD, e.g. upstream
          # editing an e2e file a previous sync discarded.
          git rm -r -q --cached --ignore-unmatch -- e2e/
          rm -rf e2e
          git checkout HEAD -- e2e/

          if [ -n "$(git ls-files --unmerged)" ]; then
            echo "Upstream merge has conflicts outside e2e/."
            exit 1
          fi

          if git rev-parse --verify -q MERGE_HEAD > /dev/null; then
            git commit --no-edit
          fi
          git push origin HEAD:main
